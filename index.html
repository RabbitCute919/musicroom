<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองห้อง</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>จองห้อง (ระบบ User)</h2>
    <form id="bookingForm">
        <label>ชื่อผู้ใช้งาน:</label>
        <input type="text" id="username" required>
        
        <label>เลือกห้อง:</label>
        <select id="room">
            <option value="Room A">ห้อง A</option>
            <option value="Room B">ห้อง B</option>
        </select>

        <label>เวลาที่ต้องการจอง:</label>
        <input type="datetime-local" id="startTime" required>

        <button type="submit">ยืนยันการจอง</button>
    </form>

    <div id="status"></div>

    <script src="script.js"></script>
</body>
</html>
