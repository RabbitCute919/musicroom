<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขอใช้ห้อง</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        .booking-item { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .btn-checkin { background-color: #28a745; width: auto; padding: 5px 15px; margin:0;}
        .btn-checkout { background-color: #dc3545; width: auto; padding: 5px 15px; margin:0;}
    </style>
</head>
<body>

    <div class="card">
        <h2>จองห้อง</h2>
        <form id="bookingForm">
            <label>ชื่อผู้ใช้งาน:</label>
            <input type="text" id="username" required>
            <label>เลือกห้อง:</label>
            <select id="room">
                <option value="Room A">ห้อง A</option>
                <option value="Room B">ห้อง B</option>
            </select>
            <label>เวลาที่ต้องการจอง:</label>
            <input type="datetime-local" id="startTime" required>
            <button type="submit">ยืนยันการจอง</button>
        </form>
        <div id="statusMessage"></div>
    </div>

    <div class="card">
        <h2>รายการเข้าใช้ห้อง (Check In / Check Out)</h2>
        <div id="bookingList">กำลังโหลดข้อมูล...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
