<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบจองห้อง</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>จองห้องใช้งาน</h2>
    
    <div class="form-group">
        <label>ชื่อผู้ใช้งาน:</label>
        <input type="text" id="userName" placeholder="ชื่อของคุณ">
    </div>
    <div class="form-group">
        <label>เลือกห้อง:</label>
        <select id="roomSelect">
            <option value="Room A">ห้องประชุม A</option>
            <option value="Room B">ห้องประชุม B</option>
        </select>
    </div>
    <button onclick="submitBooking()">ยืนยันการจอง</button>

    <p id="statusMessage"></p>

    <script>
        // นำ URL ที่ได้จาก Apps Script มาใส่ที่นี่
        const API_URL = 'https://script.google.com/macros/s/AKfycbyI4hCxhAYb0wbpXMDQGBib1pmE5lOyUDZgpFgUobuMSaCbB2d94G-MKlpgXSSbV3dn/exec';

        function submitBooking() {
            const user = document.getElementById('userName').value;
            const room = document.getElementById('roomSelect').value;
            
            document.getElementById('statusMessage').innerText = "กำลังส่งข้อมูล...";

            // ส่งข้อมูลไปยังระบบหลังบ้าน
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors', // สำคัญ: เพื่อไม่ให้ติดปัญหาข้ามโดเมนจาก GitHub ไป Google
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'bookRoom',
                    user: user,
                    room: room,
                    startTime: new Date().toISOString()
                })
            }).then(() => {
                document.getElementById('statusMessage').innerText = "จองห้องสำเร็จ ระบบได้ส่งอีเมลแจ้งแอดมินแล้ว!";
            }).catch(error => {
                console.error('Error:', error);
                document.getElementById('statusMessage').innerText = "เกิดข้อผิดพลาดในการจอง";
            });
        }
    </script>
</body>
</html>
